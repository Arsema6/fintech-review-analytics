name: Tests & Code Quality

on:
  push:
    branches: [ main, develop, task-1, task-2, task-3, task-4 ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pylint black isort
    
    - name: Lint with pylint
      run: |
        pylint src/ tests/ --disable=C0111,C0103 --fail-under=8.0 || true
    
    - name: Format check with black
      run: |
        black --check src/ tests/ || true
    
    - name: Import sorting with isort
      run: |
        isort --check-only src/ tests/ || true
    
    - name: Run tests with pytest
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=html
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: matrix.python-version == '3.11'
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
    
    - name: Security check with bandit
      run: |
        bandit -r src/ -ll || true
    
    - name: Check for known vulnerabilities
      run: |
        pip install -q safety
        safety check || true

  notebook-validation:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nbconvert nbformat
    
    - name: Validate notebooks
      run: |
        for notebook in notebooks/*.ipynb; do
          echo "Validating: $notebook"
          jupyter nbconvert --to notebook --execute "$notebook" --output=/dev/null || true
        done || true
